<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Preguntas - Menú Principal</title>
    <meta name="description" content="Juego de Preguntas - Pon a prueba tus conocimientos en solitario o compite con un amigo en modo versus">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.3.0/dist/sweetalert2.all.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Kanit:wght@700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estiloJP.css">
    <link rel="icon" type="image/webp" href="imagenes/bmo.webp">

    <script src="soundManager.js"></script>

    <style>
        /* Stars canvas */
        #stars-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.6;
        }

        /* Card divider */
        .menu-divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: 2px;
            margin: 4px auto;
            opacity: 0.7;
        }

        /* Mode cards */
        .mode-cards {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 380px;
            animation: fadeInUp 0.6s ease-out 0.35s both;
        }

        .mode-card {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 20px 24px;
            background: rgba(255,255,255,0.055);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: 0 8px 28px rgba(0,0,0,0.35);
            position: relative;
            overflow: hidden;
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1),
                        box-shadow 0.25s cubic-bezier(0.4,0,0.2,1),
                        border-color 0.25s ease;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .mode-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(232,121,249,0.12), rgba(129,140,248,0.12));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mode-card:hover::before { opacity: 1; }

        .mode-card::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%;
            height: 100%;
            background: rgba(255,255,255,0.06);
            transform: skewX(-15deg);
            transition: left 0.5s ease;
        }

        .mode-card:hover::after { left: 160%; }

        .mode-card:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: var(--primary);
            box-shadow: 0 16px 48px var(--primary-glow), 0 8px 20px rgba(0,0,0,0.4);
            color: #fff;
        }

        .mode-icon {
            font-size: 2.4rem;
            min-width: 52px;
            text-align: center;
            filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4));
            transition: transform 0.3s ease;
        }

        .mode-card:hover .mode-icon {
            transform: scale(1.15) rotate(-5deg);
        }

        .mode-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
            z-index: 1;
        }

        .mode-title {
            font-family: 'Kanit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
        }

        .mode-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .mode-arrow {
            font-size: 1.2rem;
            color: var(--text-muted);
            transition: transform 0.25s ease, color 0.25s ease;
            position: relative;
            z-index: 1;
        }

        .mode-card:hover .mode-arrow {
            transform: translateX(5px);
            color: var(--primary);
        }

        /* Version badge */
        .version-badge {
            font-size: 0.72rem;
            color: rgba(148, 163, 184, 0.5);
            letter-spacing: 1px;
            margin-top: 4px;
            animation: fadeInUp 0.6s ease-out 0.5s both;
        }

        /* Gradient ring behind BMO */
        .bmo-wrapper {
            position: relative;
            display: inline-block;
            animation: fadeInUp 0.6s ease-out both;
        }

        .bmo-ring {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--primary), var(--accent), #38bdf8, var(--primary));
            opacity: 0.3;
            animation: spin 6s linear infinite;
            filter: blur(8px);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Animated stars canvas -->
    <canvas id="stars-canvas"></canvas>

    <div class="menuPrincipal">

        <!-- BMO Hero with ring effect -->
        <div class="bmo-wrapper">
            <div class="bmo-ring"></div>
            <img class="bmo-hero-img" src="imagenes/bmo.webp" alt="BMO Mascota">
        </div>

        <h1 class="main-title">Juego de Preguntas</h1>
        <div class="menu-divider"></div>
        <p class="main-subtitle">Pon a prueba tus conocimientos en solitario o<br>compite con un amigo</p>

        <!-- Mode selection cards -->
        <div class="mode-cards">
            <a class="mode-card" href="indexJP.html" onclick="SoundManager.playClick()">
                <span class="mode-icon">👤</span>
                <div class="mode-info">
                    <span class="mode-title">Un Jugador</span>
                    <span class="mode-desc">Responde 8 preguntas contra el tiempo</span>
                </div>
                <span class="mode-arrow">→</span>
            </a>

            <a class="mode-card" href="nombreVersus.html" onclick="SoundManager.playClick()">
                <span class="mode-icon">⚔️</span>
                <div class="mode-info">
                    <span class="mode-title">Modo Versus</span>
                    <span class="mode-desc">Compite cara a cara con un amigo</span>
                </div>
                <span class="mode-arrow">→</span>
            </a>
        </div>

        <span class="version-badge">v2.0 · BMO Quiz Game</span>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            SoundManager.init("julia-133094.mp3");
            initStars();
        });

        // Animated floating stars
        function initStars() {
            const canvas = document.getElementById("stars-canvas");
            const ctx = canvas.getContext("2d");

            function resize() {
                canvas.width  = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener("resize", resize);

            const STAR_COUNT = 120;
            const stars = Array.from({ length: STAR_COUNT }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 1.8 + 0.3,
                speed: Math.random() * 0.3 + 0.05,
                alpha: Math.random() * 0.7 + 0.2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
                twinkleDir: Math.random() > 0.5 ? 1 : -1,
            }));

            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(s => {
                    s.alpha += s.twinkleSpeed * s.twinkleDir;
                    if (s.alpha >= 0.9 || s.alpha <= 0.1) s.twinkleDir *= -1;
                    s.y -= s.speed;
                    if (s.y < -2) { s.y = canvas.height + 2; s.x = Math.random() * canvas.width; }

                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }
            draw();
        }
    </script>
</body>
</html>
