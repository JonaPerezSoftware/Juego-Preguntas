<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=pagPrincipal.html">
    <title>Juego de Preguntas</title>
    <link rel="icon" type="image/webp" href="imagenes/bmo.webp">
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
            color: white;
        }
        .splash {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        .splash img { width: 100px; animation: float 1.5s infinite ease-in-out; }
        .splash p { margin-top: 16px; color: #94a3b8; font-size: 1rem; }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="splash">
        <img src="imagenes/bmo.webp" alt="BMO">
        <p>Cargando...</p>
    </div>
    <script>
        // Redirect immediately to the main menu
        window.location.replace("pagPrincipal.html");
    </script>
</body>
</html>
