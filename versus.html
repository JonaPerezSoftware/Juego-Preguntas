<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Preguntas - Modo Versus</title>
    <meta name="description" content="Modo Versus - Compite con un amigo respondiendo preguntas de cultura general">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.3.0/dist/sweetalert2.all.min.js"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Kanit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="estiloJP.css">
    <link rel="icon" type="image/webp" href="imagenes/bmo.webp">

    <script src="soundManager.js"></script>
    <script src="basePreguntas.js"></script>
    <script defer src="index.js"></script>
</head>
<body>

    <div id="tablero-de-juego">
        
        <!-- Turn Indicator -->
        <div class="nombresJugadores">
            Turno de: <span id="mostrarJugador1">Jugador</span>
        </div>

        <!-- Game Stats & Countdown -->
        <div class="game-stats">
            <div class="stat-badge">
                <span class="stat-label">Nivel</span>
                <span class="stat-value" id="nivel">1</span>
            </div>

            <div id="countdown-wrapper">
                <div id="countdown">10</div>
            </div>

            <button class="btn-pista" onclick="pista()">
                💡 Pista
            </button>
        </div>

        <!-- Question & Media Card -->
        <div id="encabezado">
            <h2 id="pregunta">Cargando pregunta...</h2>
            <img id="imagen" src="" alt="Imagen de la pregunta" style="display:none;">
        </div>

        <!-- 4 Options in Responsive Grid -->
        <div class="options-grid">
            <button class="opcion" id="opcion-1" onclick="seleccionarOpcion(0)">
                Opción 1
            </button>
            <button class="opcion" id="opcion-2" onclick="seleccionarOpcion(1)">
                Opción 2
            </button>
            <button class="opcion" id="opcion-3" onclick="seleccionarOpcion(2)">
                Opción 3
            </button>
            <button class="opcion" id="opcion-4" onclick="seleccionarOpcion(3)">
                Opción 4
            </button>
        </div>

        <!-- Score display -->
        <div class="scores-display">
            <div class="score-card" id="score-card-1">
                <span class="score-player-name" id="score-name-1">Jugador 1</span>
                <span class="score-value" id="score-value-1">0</span>
                <span class="score-label">pts</span>
            </div>
            <div class="score-divider">VS</div>
            <div class="score-card" id="score-card-2">
                <span class="score-player-name" id="score-name-2">Jugador 2</span>
                <span class="score-value" id="score-value-2">0</span>
                <span class="score-label">pts</span>
            </div>
        </div>

        <!-- Navigation Return -->
        <div id="outer">
            <a class="btn-secondary-game" href="nombreVersus.html" onclick="if(typeof SoundManager !== 'undefined') SoundManager.playClick()">
                ⬅️ Cambiar Jugadores
            </a>
        </div>
        
    </div>
    
</body>
</html>
